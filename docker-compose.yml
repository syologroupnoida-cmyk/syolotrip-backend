services:
  postgres:
    image: postgres:17-alpine
    container_name: traveler-postgres
    restart: always
    environment:
      POSTGRES_DB: traveler_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d traveler_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
